[package]
name = "las-window"
description = "Lumen Audio Studio: native windows that hold plugin editors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[lints.rust]
unsafe_code = "allow"
