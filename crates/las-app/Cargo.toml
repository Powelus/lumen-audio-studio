[package]
name = "las-app"
description = "Lumen Audio Studio: the native application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
publish = false

[[bin]]
name = "lumen"
path = "src/main.rs"

build = "build.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# ASIO drivers on Windows (an interface's own, ASIO4ALL, FL Studio ASIO). Building it
# needs the Steinberg ASIO SDK (CPAL_ASIO_DIR pointing at it) and LLVM's libclang; the
# Windows release and CI builds fetch the SDK and turn this on. Without it, WASAPI only.
asio = ["cpal/asio"]

[dependencies]
cpal = "0.18.2"
# glow starts in a moment where wgpu probes DirectX and Vulkan first, and the
# bundled fonts load at once where the system fonts are scanned one by one
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "x11", "glow"] }
# the symbols the app draws (stars, dots, arrows) come from these bundled fonts
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
las-dsp = { path = "../las-dsp" }
las-engine = { path = "../las-engine" }
las-host = { path = "../las-host" }
las-project = { path = "../las-project" }
midir = "0.11.1"
rtrb = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
rfd = "0.17.2"
memory-stats = "1"

[lints]
workspace = true
