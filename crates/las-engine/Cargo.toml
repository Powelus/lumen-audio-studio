[package]
name = "las-engine"
description = "Plays and renders Lumen Audio Studio projects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
las-dsp = { path = "../las-dsp" }
las-project = { path = "../las-project" }
serde_json = "1"
hound = "3"
flacenc = "0.5.1"
mp3lame-encoder = "0.2"
claxon = "0.4"
# reading the audio files people drop in: MP3, FLAC, OGG Vorbis, AIFF, M4A and WAV
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aiff", "isomp4", "aac"] }

